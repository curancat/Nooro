<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Miraculos da Mariposa</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lobster&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#2E003E;color:#E0C3FF;
      font-family:'Lobster',cursive;display:flex;
      align-items:center;justify-content:center;height:100vh;position:relative}
    .phone{width:320px;height:600px;background:#4B1E78;
      border-radius:30px;box-shadow:0 10px 25px rgba(75,30,120,0.6);
      padding:20px;display:flex;flex-direction:column;
      justify-content:space-between}
    h3 mark{background:#6E3AA5;color:#fff;padding:5px 10px;border-radius:8px}
    h3{text-align:center;font-size:24px}
    .buttons{display:flex;flex-direction:column;align-items:center;gap:8px}
    button{width:80%;padding:10px;background:#9B59B6;border:none;
      border-radius:20px;font-size:18px;color:#fff;cursor:pointer;
      transition:.3s;font-family:'Lobster',cursive}
    button:hover{background:#BE90D4}
    .flash{position:absolute;top:0;left:0;width:100%;height:100%;
      background:rgba(155,89,182,0.6);animation:fade 1s forwards}
    @keyframes fade{from{opacity:1}to{opacity:0}}
  </style>
</head>
<body>
  <div class="phone">
    <h3><mark>Miraculos da Mariposa</mark></h3>
    <div class="buttons">
      <button onclick="enviarMensagem()">💬 Enviar mensagem</button>
      <button onclick="lerConversa()">📖 Ler conversa</button>
      <button onclick="concederPoder()">✨ Carregar akuma</button>
      <button onclick="verPoderes()">💼 Meus Poderes</button>
      <button onclick="usarPoder()">🔮 Akumatizar</button>
    </div>
  </div>

  <script>
  alert('NOORO ASAS SOMBRIAS CRESÇAM');
    const PARTICIPANTES = ['Litlegot','Psique','Abrax','Beast','Hell Cat','Yellowfer'];
    const ME = 'Psique';
    const channel = new BroadcastChannel('global_channel');
    const _load = k => JSON.parse(localStorage.getItem(k)||'[]');
    const _save = (k,v) => localStorage.setItem(k, JSON.stringify(v));

    channel.onmessage = ev => {
      const { type, data } = ev.data;
      if (type==='msg' && data.to===ME) {
        alert(`📨 De ${data.from}: ${data.text}`);
      }
      if (type==='power' && data.to===ME) {
        savePower(data);
        flash();
      }
      if (type==='usePower' && data.to===ME) {
        alert(`✨ ${data.from} usou "${data.power}" em você!`);
      }
    };

    function enviarMensagem() {
      let dest = prompt(`Enviar para quem?\n${PARTICIPANTES.filter(p=>p!==ME).join(', ')}`);
      if (!PARTICIPANTES.includes(dest)||dest===ME) return alert('Destino inválido.');
      let txt = prompt(`Mensagem de ${ME} para ${dest}:`);
      if (!txt||!txt.trim()) return;
      const msg = { from:ME,to:dest,text:txt.trim() };
      const msgs=_load('msgs'); msgs.push(msg); _save('msgs',msgs);
      channel.postMessage({type:'msg',data:msg});
      alert('Mensagem enviada!');
    }

    function lerConversa() {
      let peer = prompt(`Ler conversa com?\n${PARTICIPANTES.filter(p=>p!==ME).join(', ')}`);
      if (!PARTICIPANTES.includes(peer)||peer===ME) return alert('Participante inválido.');
      const msgs=_load('msgs').filter(m=>
        (m.from===ME&&m.to===peer)||(m.from===peer&&m.to===ME)
      );
      if(!msgs.length) return alert('Sem mensagens.');
      alert(msgs.map(m=>`${m.from}: ${m.text}`).join('\n'));
    }

    function concederPoder() {
      let dest = prompt(`Conceder poder a quem?\n${PARTICIPANTES.filter(p=>p!==ME).join(', ')}`);
      if (!PARTICIPANTES.includes(dest)||dest===ME) return alert('Destino inválido.');
      let power = prompt('Qual poder?');
      if (!power||!power.trim()) return;
      const p={from:ME,to:dest,power:power.trim()};
      savePower(p);
      channel.postMessage({type:'power',data:p});
      flash(); alert(`Concedido "${power.trim()}" a ${dest}`);
    }

    function savePower(p){
      const ps=_load('powers'); ps.push(p); _save('powers',ps);
    }

    function verPoderes(){
      const ps=_load('powers').filter(p=>p.to===ME);
      if(!ps.length) return alert('Sem poderes recebidos.');
      alert(ps.map((p,i)=>`${i+1}. ${p.power} (de ${p.from})`).join('\n'));
    }

    function usarPoder(){
      const ps=_load('powers').filter(p=>p.to===ME);
      if(!ps.length) return alert('Sem poderes para usar.');
      let idx = +prompt(
        ps.map((p,i)=>`${i+1}. ${p.power} (de ${p.from})`).join('\n')
        +'\n\nNúmero do poder:'
      )-1;
      if(ps[idx]){
        channel.postMessage({type:'usePower',data:{from:ME,to:ps[idx].from,power:ps[idx].power}});
        flash(); alert(`Você usou: ${ps[idx].power}`);
      } else alert('Escolha inválida.');
    }

    function flash(){
      const f=document.createElement('div');
      f.className='flash'; document.body.appendChild(f);
      document.querySelectorAll('button').forEach(b=>b.disabled=true);
      setTimeout(()=>{
        f.remove();
        document.querySelectorAll('button').forEach(b=>b.disabled=false);
      },1000);
    }
  </script>
</body>
</html>
